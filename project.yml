name: ShoesOn
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    GENERATE_INFOPLIST_FILE: NO

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.14.0

schemes:
  ShoesOn:
    build:
      targets:
        ShoesOn: all
        ShoesOnWatch: all
        ShoesOnTests: [test]
        ShoesOnUITests: [test]
    test:
      config: Debug
      targets:
        - ShoesOnTests
        - ShoesOnUITests
      storeKitConfiguration: ShoesOn.storekit
    run:
      config: Debug
      storeKitConfiguration: ShoesOn.storekit
  ShoesOnWatch:
    build:
      targets:
        ShoesOnWatch: all
    run:
      config: Debug

targets:
  ShoesOn:
    type: application
    platform: iOS
    sources:
      - path: ShoesOn
        excludes: ["Info.plist", "*.entitlements"]
      - path: ShoesOn.storekit
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.time
        PRODUCT_NAME: ShoesOn
        INFOPLIST_FILE: ShoesOn/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShoesOn/ShoesOn.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - target: ShoesOnWidget
      - target: ShoesOnWatch
        embed: true

  ShoesOnWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ShoesOnWidget
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared/LiveActivity/RunActivityAttributes.swift
      - path: Shared/LiveActivity/RunIntents.swift
      - path: Shared/Engine
      - path: Shared/Models
      - path: Shared/Utilities/Format.swift
      - path: Shared/Utilities/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.time.widget
        INFOPLIST_FILE: ShoesOnWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShoesOnWidget/ShoesOnWidget.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"

  ShoesOnWatch:
    type: application
    platform: watchOS
    sources:
      - path: ShoesOnWatch
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared/Engine
      - path: Shared/Models
      - path: Shared/Services/WatchSyncService.swift
      - path: Shared/Utilities/AppGroup.swift
      - path: Shared/Utilities/Format.swift
      - path: Shared/Utilities/Theme.swift
      - path: Shared/Utilities/ScreenshotConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.time.watch
        INFOPLIST_FILE: ShoesOnWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

  ShoesOnTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShoesOnTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.time.tests
    dependencies:
      - target: ShoesOn

  ShoesOnUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ShoesOnUITests
    dependencies:
      - target: ShoesOn
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.time.uitests
        TEST_TARGET_NAME: ShoesOn
